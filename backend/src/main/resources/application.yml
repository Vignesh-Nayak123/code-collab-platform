spring:
  application:
    name: collaborative-code-editor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # DB_URL wins if set; otherwise it is built from DB_HOST/DB_PORT/DB_NAME (what Render's Blueprint provides).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codeeditor}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: code-execution-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  # Render injects PORT; SERVER_PORT still takes precedence for docker-compose/k8s.
  port: ${SERVER_PORT:${PORT:8080}}
  servlet:
    context-path: /

app:
  execution:
    # kafka (default): queue runs through Kafka -> Docker sandbox
    # inline: no Kafka, runs one at a time in-process -> Docker sandbox (Docker daemon still required)
    # disabled: never runs user code; returns an explanatory FAILED result
    mode: ${EXECUTION_MODE:kafka}
  cors:
    # Comma-separated origin patterns for REST CORS and the /ws handshake.
    allowed-origins: ${ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mohitprasad.codeeditor: INFO
    org.springframework.web.socket: WARN
