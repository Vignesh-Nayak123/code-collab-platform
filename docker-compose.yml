version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeeditor-postgres
    environment:
      POSTGRES_DB: codeeditor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeeditor-network

  redis:
    image: redis:7-alpine
    container_name: codeeditor-redis
    ports:
      - "6383:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeeditor-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: codeeditor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - codeeditor-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: codeeditor-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - codeeditor-network

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeeditor-backend1
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/codeeditor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      # Code execution: temp files live in a daemon-shared volume so the
      # daemon can bind-mount them into execution containers (-v name:<sub>).
      EXECUTION_TMP_DIR: /tmp/code-exec
      EXECUTION_TMP_VOLUME: codeeditor-exec-tmp
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - codeeditor-exec-tmp:/tmp/code-exec
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - codeeditor-network
    restart: unless-stopped

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeeditor-backend2
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/codeeditor
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      # Code execution: temp files live in a daemon-shared volume so the
      # daemon can bind-mount them into execution containers (-v name:<sub>).
      EXECUTION_TMP_DIR: /tmp/code-exec
      EXECUTION_TMP_VOLUME: codeeditor-exec-tmp
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - codeeditor-exec-tmp:/tmp/code-exec
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - codeeditor-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeeditor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    networks:
      - codeeditor-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: # Pinned name so the backend's docker command can mount subdirectories of

  # this volume by name regardless of the compose project prefix.
  codeeditor-exec-tmp:
    name: codeeditor-exec-tmp

networks:
  codeeditor-network:
    driver: bridge
